# Type-checking config only (this repo is not packaged).
# Run: mypy   (from the repo root, in an env with mypy + pandas-stubs)
[tool.mypy]
strict = true
python_version = "3.11"
files = ["hsp65_refalign", "01_validate_hsp65_refalign.py", "02_blast_reads.py", "03_figure.py"]
explicit_package_bases = true
# Biopython ships py.typed but leaves many functions unannotated.
untyped_calls_exclude = ["Bio"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
